name: Signed release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and signing configuration
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          test -n "$SIGNING_CERT_SHA256"
          actual=$(keytool -exportcert -keystore "$SIGNING_STORE_FILE" -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" | sha256sum | cut -d ' ' -f1)
          expected=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          test "$actual" = "$expected"
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :domain:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Name artifacts and generate checksums
        shell: bash
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TatkalFastAssistant-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/TatkalFastAssistant-${GITHUB_REF_NAME}.aab"
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Tatkal Fast Assistant $GITHUB_REF_NAME"
      - name: Remove signing material
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
