name: Publish v1.1.0 Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d5c4134beb8f84c5103065fe352ddf6e7c3ad6c8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tatkal-Fast-Assistant-v1.1.0.apk

      - name: Publish v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Tatkal Fast Assistant v1.1.0
          target_commitish: d5c4134beb8f84c5103065fe352ddf6e7c3ad6c8
          generate_release_notes: true
          files: Tatkal-Fast-Assistant-v1.1.0.apk
