name: Native assistant checks and preview APK
on:
  push:
    branches: ['**']
    paths: ['native-assistant/**', '.github/workflows/native-android.yml']
  pull_request:
    paths: ['native-assistant/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    working-directory: native-assistant
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure stable preview signing when available
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_CERT_SHA256: ${{ secrets.DEBUG_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            test -n "$DEBUG_STORE_PASSWORD" && test -n "$DEBUG_KEY_ALIAS" && test -n "$DEBUG_KEY_PASSWORD" && test -n "$DEBUG_CERT_SHA256"
            umask 077
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/preview.jks"
            actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/preview.jks" -storepass:env DEBUG_STORE_PASSWORD -alias "$DEBUG_KEY_ALIAS" | sha256sum | cut -d ' ' -f1)
            expected=$(printf '%s' "$DEBUG_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
            test "$actual" = "$expected"
            echo "DEBUG_STORE_FILE=$RUNNER_TEMP/preview.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::No stable preview signing key configured. This APK may not update previous previews. Export an encrypted backup before replacing an installation.'
          fi
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease :app:lintRelease
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk TatkalFastAssistant-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TatkalFastAssistant-debug
          path: native-assistant/TatkalFastAssistant-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            native-assistant/domain/build/reports/
            native-assistant/app/build/reports/
      - name: Remove temporary signing file
        if: always()
        run: python3 -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"]) / "preview.jks").unlink(missing_ok=True)'
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd native-assistant && ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-${{ matrix.api }}
          path: |
            native-assistant/app/build/reports/androidTests/
            native-assistant/app/build/outputs/androidTest-results/
